<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- displays site properly based on user's device -->

  <link rel="icon" type="image/png" sizes="32x32" href="./assets/images/favicon-32x32.png">
  
  <title>Frontend Mentor | Social links profile</title>
  <link rel="stylesheet" href="styles.css">

  <!-- Feel free to remove these styles or customise in your own stylesheet 👍 -->
  <style>
    .attribution { font-size: 11px; text-align: center; }
    .attribution a { color: hsl(228, 45%, 44%); }
  </style>
</head>
<body>

  <main>
    <article class="profile-card">
      <section class="profile-photo">
        <img src="./assets/images/avatar-jessica.jpeg" alt="Preview image">
      </section>
    <section class="profile-info">
      <h1 class="text-preset-1">Jessica Randall</h1>
      <p class="text-preset-2-bold green-text">London, United Kingdom</p>
    </section>
    <section class="about text-preset-2">
      "Front-end developer and avid reader."
    </section>
    <section class="links">
      <div class="profile-link text-preset-2-bold">GitHub</div>
      <div class="profile-link text-preset-2-bold">Frontend Mentor</div>
      <div class="profile-link text-preset-2-bold">LinkedIn</div>
      <div class="profile-link text-preset-2-bold">Twitter</div>
      <div class="profile-link text-preset-2-bold">Instagram</div>  
    </section>
    </article>
  
  

 
  </main>
</body>
</html>
