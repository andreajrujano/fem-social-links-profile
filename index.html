<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- displays site properly based on user's device -->
  <link rel="icon" type="image/png" sizes="32x32" href="./assets/images/favicon-32x32.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Figtree:ital,wght@0,300..900;1,300..900&display=swap" rel="stylesheet">
  <title>Frontend Mentor | Social links profile</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main>
    <div class="profile__card">
        <div class="profile__photo">
          <img src="./assets/images/avatar-jessica.jpeg" alt="Photo of Jessica Randall">
        </div>
      <div class="profile__info">
        <h1 class="profile__name">Jessica Randall</h1>
        <p class="profile__location">London, United Kingdom</p>
      </div>
      <p class="profile__about">
        "Front-end developer and avid reader."
      </p>
      <ul class="profile__links">
        <li><a href="#" class="profile__links-item" target="_blank" rel="noopener noreferrer">GitHub</a></li>
        <li><a href="#" class="profile__links-item" target="_blank" rel="noopener noreferrer">Frontend Mentor</a></li>
        <li><a href="#" class="profile__links-item" target="_blank" rel="noopener noreferrer">LinkedIn</a></li>
        <li><a href="#" class="profile__links-item" target="_blank" rel="noopener noreferrer">Twitter</a></li>
        <li><a href="#" class="profile__links-item" target="_blank" rel="noopener noreferrer">Instagram</a></li>
      </ul>
    </div>
  </main>
</body>
</html>
